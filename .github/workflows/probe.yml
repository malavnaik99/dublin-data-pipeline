# One-off: shows the columns and row counts of the raw data, to design the dbt models. Deleted afterwards.
name: Probe raw data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q duckdb
      - shell: python
        run: |
          import duckdb
          con = duckdb.connect()
          base = "hf://datasets/Malavnaik/dublin-bikes-weather-raw/raw"
          for t in ["bikes", "stations", "weather"]:
              src = f"read_parquet('{base}/{t}/*/*.parquet', hive_partitioning=true, union_by_name=true)"
              print(f"\n=== {t} ===")
              print(con.sql(f"DESCRIBE SELECT * FROM {src}"))
              print(con.sql(f"SELECT count(*) rows, count(DISTINCT fetched_at) runs, min(fetched_at), max(fetched_at) FROM {src}"))
              print(con.sql(f"SELECT * FROM {src} LIMIT 2"))
