# Runs the unit tests when the code changes (moved out of the 15-minute collector, so a test-runner hiccup can't fail a collection).
name: Tests
on:
  push:
    paths: ["**.py", "tests/**", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          ARROW_DEFAULT_MEMORY_POOL: system  # avoids pyarrow's rare "terminate called" crash when Python exits
