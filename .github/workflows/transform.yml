# Hourly: dbt models + data tests (incl. freshness and volume) on the collected data; publishes the marts and sky/latest.json.
# Started every hour by the collector's :15 run (see ingest.yml), or by hand: GitHub's own schedule fires only every few hours here.
# Hourly because the website shows sky/latest.json as live only while it is under 2 hours old. Alerts on Telegram if anything fails.
name: Transform (dbt)
on:
  workflow_dispatch:
    inputs:
      full_refresh: { description: "Rebuild the fact table from all raw data", type: boolean, default: false }
concurrency: transform
jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      DBT_FULL_REFRESH: ${{ inputs.full_refresh && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q duckdb==1.5.6 dbt-duckdb==1.11.0 dbt-core==1.12.6 huggingface_hub  # pinned: an unpinned duckdb update broke the 22 Oct run
      - run: python transform.py
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          msg="⚠️ Dublin data pipeline: a data check failed in an hourly run (for example, data is late or missing). Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$msg"
