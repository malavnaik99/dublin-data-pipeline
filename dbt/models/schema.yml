version: 2
models:
  - name: stg_bikes
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]
  - name: dim_station
    columns:
      - name: station_id
        data_tests: [unique, not_null]
  - name: dim_hour
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
  - name: fct_station_hour
    columns:
      - name: station_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_station'), field: station_id}}
      - name: hour_utc
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_hour'), field: hour_utc}}
